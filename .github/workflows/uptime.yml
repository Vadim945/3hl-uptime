name: uptime-3hl

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping 3HL dashboard
        run: |
          code=$(curl -s -L --max-time 20 -o /dev/null -w '%{http_code}' \
            "https://vadim3hl.serveousercontent.com/?serveo-skip-browser-warning=true")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::3HL dashboard DOWN (HTTP $code)"
            exit 1
          fi

      - name: Telegram alert (only if secrets are set)
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="🔴 3HL: дашборд недоступен снаружи"
          else
            echo "no telegram secrets set - skipping"
          fi
