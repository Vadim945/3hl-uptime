name: uptime-3hl

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Отправить тестовое уведомление в Telegram"
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Test Telegram alert
        if: ${{ github.event.inputs.test == 'true' }}
        env:
          TG_${{ secrets.TELEGRAM }}EN: ${{ secrets.TELEGRAM }}
          TG_${{ secrets.TELEGRAM_CHAT_ID }}: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_${{ secrets.TELEGRAM }}EN" ] || [ -z "$TG_${{ secrets.TELEGRAM_CHAT_ID }}" ]; then echo "::error::Telegram secrets not set"; exit 1; fi
          curl -s -X POST "https://api.telegram.org/bot$TG_${{ secrets.TELEGRAM }}EN/sendMessage" \
            -d chat_id="$TG_${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="3HL uptime: test - Telegram delivery OK"

      - name: Ping 3HL dashboard
        if: ${{ github.event.inputs.test != 'true' }}
        id: ping
        run: |
          code=$(curl -s -L --max-time 20 -o /dev/null -w '%{http_code}' \
            "https://vadim3hl.serveousercontent.com/?serveo-skip-browser-warning=true")
          echo "HTTP $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "200" ]; then
            echo "::error::3HL dashboard DOWN (HTTP $code)"
            exit 1
          fi

      - name: Telegram alert on failure
        if: ${{ failure() && github.event.inputs.test != 'true' }}
        env:
          TG_${{ secrets.TELEGRAM }}EN: ${{ secrets.TELEGRAM }}
          TG_${{ secrets.TELEGRAM_CHAT_ID }}: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TG_${{ secrets.TELEGRAM }}EN" ] && [ -n "$TG_${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TG_${{ secrets.TELEGRAM }}EN/sendMessage" \
              -d chat_id="$TG_${{ secrets.TELEGRAM_CHAT_ID }}" \
              --data-urlencode text="3HL DOWN: dashboard unreachable (HTTP ${{ steps.ping.outputs.code }}) - $(date -u +'%Y-%m-%d %H:%M UTC')"
          else
            echo "no telegram secrets set - skipping"
          fi
